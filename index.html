<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>見開きブックリーダー (PDF / ZIP / 画像対応)</title>
  <!-- PDF.js & JSZip -->
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --panel-hover: #252a38;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2e3446;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px;
      background-color: var(--panel);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    button, .file-btn {
      background-color: var(--panel-hover);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
    }

    button:hover, .file-btn:hover {
      background-color: #32394c;
    }

    button:active, .file-btn:active {
      transform: scale(0.97);
    }

    button.primary, .file-btn.primary {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover, .file-btn.primary:hover {
      background-color: var(--accent-hover);
    }

    input[type="file"] {
      display: none;
    }

    /* メインビューア領域 */
    main {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b1f2b 0%, #0b0d12 100%);
    }

    /* 初期ドロップ画面 */
    #drop-zone {
      position: absolute;
      inset: 24px;
      border: 2px dashed #4b5563;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: rgba(26, 29, 39, 0.85);
      z-index: 10;
      transition: border-color 0.2s, background 0.2s;
    }

    #drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.15);
    }

    #drop-zone h2 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    #drop-zone p {
      margin: 0 0 20px;
      color: var(--muted);
      max-width: 520px;
      line-height: 1.6;
    }

    /* 見開きブックキャンバスのコンテナ */
    #book-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    #spread-canvas {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.85);
      border-radius: 4px;
      background: #111;
      object-fit: contain;
    }

    /* 全画面・バー非表示モード */
    body.ui-hidden header,
    body.ui-hidden footer,
    body.pseudo-fullscreen header,
    body.pseudo-fullscreen footer {
      display: none !important;
    }

    body.ui-hidden #book-container,
    body.pseudo-fullscreen #book-container {
      padding: 0;
    }

    #btn-restore-ui {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 40;
      background: rgba(26, 29, 39, 0.85);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      display: none;
      opacity: 0.8;
    }

    #btn-restore-ui:hover {
      opacity: 1;
    }

    body.ui-hidden #btn-restore-ui,
    body.pseudo-fullscreen #btn-restore-ui {
      display: inline-flex;
    }

    /* 左右タップ領域 */
    .nav-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 28%;
      z-index: 5;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .nav-zone:hover {
      opacity: 1;
    }

    .nav-left {
      left: 0;
      justify-content: flex-start;
      background: linear-gradient(to right, rgba(0,0,0,0.35), transparent);
    }

    .nav-right {
      right: 0;
      justify-content: flex-end;
      background: linear-gradient(to left, rgba(0,0,0,0.35), transparent);
    }

    .nav-badge {
      background: rgba(15, 17, 23, 0.8);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 1.2rem;
    }

    /* フッター */
    footer {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      background-color: var(--panel);
      border-top: 1px solid var(--border);
      z-index: 20;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 8px;
      cursor: pointer;
    }

    #page-info {
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
      min-width: 110px;
      text-align: right;
    }

    /* トースト */
    #toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid #4b5563;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.92rem;
      max-width: 90vw;
      z-index: 100;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      line-height: 1.5;
    }

    /* ローディング */
    #loader {
      position: fixed;
      inset: 0;
      background: rgba(15, 17, 23, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      gap: 12px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <span>📖 見開きブックリーダー</span>
  </div>
  <div class="controls">
    <label class="file-btn primary">
      📂 ファイルを開く
      <input type="file" id="file-input" accept=".pdf,.zip,.cbz,image/*" multiple />
    </label>
    <button type="button" id="btn-direction" title="綴じ方向の切り替え">右綴じ (←次へ)</button>
    <button type="button" id="btn-cover" title="表紙を単独表示するか">表紙単独: ON</button>
    <button type="button" id="btn-hide-ui" title="上下バーを隠して本だけを大きく表示">🗖 バーを隠す</button>
    <button type="button" id="btn-fullscreen" title="全画面表示にする (Fキー)">⛶ 全画面表示</button>
  </div>
</header>

<button type="button" id="btn-restore-ui" title="メニューバーと全画面を解除">✕ 全画面 / バー表示</button>

<main id="main-area">
  <div id="drop-zone">
    <h2>PDF・ZIP/CBZ・画像ファイルをここにドロップ</h2>
    <p>
      対応形式: <strong>.pdf</strong> / <strong>.zip</strong> / <strong>.cbz</strong> / <strong>.jpg, .webp, .png</strong>（複数選択可）<br />
      ファイルはサーバーに送信されず、お使いのブラウザ内だけで安全に処理されます。
    </p>
    <label class="file-btn primary" style="font-size:1.05rem; padding:14px 24px;">
      📂 本を選択する
      <input type="file" id="file-input-center" accept=".pdf,.zip,.cbz,image/*" multiple />
    </label>
  </div>

  <div class="nav-zone nav-left" id="zone-left"><div class="nav-badge">◀</div></div>
  <div class="nav-zone nav-right" id="zone-right"><div class="nav-badge">▶</div></div>

  <div id="book-container">
    <canvas id="spread-canvas"></canvas>
  </div>
</main>

<footer>
  <button type="button" id="btn-prev">◀ 前へ</button>
  <input type="range" id="page-slider" min="0" max="0" value="0" />
  <button type="button" id="btn-next">次へ ▶</button>
  <div id="page-info">0 / 0 ページ</div>
</footer>

<div id="loader">
  <div style="font-size: 1.5rem;">⏳ 読み込み中...</div>
  <div id="loader-text" style="color: var(--muted);">準備しています</div>
</div>

<div id="toast"></div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    // アプリ状態
    const state = {
      mode: "none", // "pdf" | "images"
      totalPages: 0,
      currentIndex: 0,
      spreads: [],
      rtl: true, // true: 右綴じ(漫画・日本語), false: 左綴じ(洋書)
      singleCover: true,
      pdfDoc: null,
      imageItems: []
    };

    const spreadCanvas = document.getElementById("spread-canvas");
    const ctx = spreadCanvas.getContext("2d");
    const dropZone = document.getElementById("drop-zone");
    const pageSlider = document.getElementById("page-slider");
    const pageInfo = document.getElementById("page-info");
    const loader = document.getElementById("loader");
    const loaderText = document.getElementById("loader-text");
    const toast = document.getElementById("toast");
    const btnFullscreen = document.getElementById("btn-fullscreen");

    function showToast(msg, duration = 5000) {
      toast.innerHTML = msg;
      toast.style.display = "block";
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.style.display = "none";
      }, duration);
    }

    function showLoader(show, text = "") {
      loader.style.display = show ? "flex" : "none";
      loaderText.textContent = text;
    }

    // 全画面表示切り替え（Questブラウザ等の制限時も確実に最大化するフォールバック付き）
    async function toggleFullscreen() {
      const isNativeFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
      const isPseudoFull = document.body.classList.contains("pseudo-fullscreen");

      if (isNativeFull || isPseudoFull) {
        document.body.classList.remove("pseudo-fullscreen", "ui-hidden");
        try {
          if (document.exitFullscreen && document.fullscreenElement) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen && document.webkitFullscreenElement) {
            await document.webkitExitFullscreen();
          }
        } catch (e) {}
        updateFullscreenUI();
        return;
      }

      try {
        const el = document.documentElement;
        if (el.requestFullscreen) {
          await el.requestFullscreen();
          document.body.classList.add("ui-hidden");
        } else if (el.webkitRequestFullscreen) {
          await el.webkitRequestFullscreen();
          document.body.classList.add("ui-hidden");
        } else {
          throw new Error("Fullscreen API unsupported");
        }
      } catch (err) {
        // QuestブラウザのウィンドウモードなどでNative Fullscreenが弾かれた場合はウィンドウ内最大化
        document.body.classList.add("pseudo-fullscreen");
      }
      updateFullscreenUI();
    }

    function updateFullscreenUI() {
      const isFull = !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.body.classList.contains("pseudo-fullscreen")
      );
      btnFullscreen.textContent = isFull ? "✕ 全画面解除" : "⛶ 全画面表示";
    }

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) {
        document.body.classList.remove("ui-hidden", "pseudo-fullscreen");
      }
      updateFullscreenUI();
    });
    document.addEventListener("webkitfullscreenchange", () => {
      if (!document.webkitFullscreenElement) {
        document.body.classList.remove("ui-hidden", "pseudo-fullscreen");
      }
      updateFullscreenUI();
    });

    btnFullscreen.addEventListener("click", toggleFullscreen);

    // 上下UIバーの表示/非表示切り替え
    document.getElementById("btn-hide-ui").addEventListener("click", () => {
      document.body.classList.add("ui-hidden");
    });

    document.getElementById("btn-restore-ui").addEventListener("click", async () => {
      document.body.classList.remove("ui-hidden", "pseudo-fullscreen");
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
          await document.webkitExitFullscreen();
        }
      } catch (e) {}
      updateFullscreenUI();
    });

    // 自然順ソート（2.jpg の後に 10.jpg が来るようにする）
    const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });

    function buildSpreads() {
      state.spreads = [];
      if (state.totalPages <= 0) return;

      let i = 0;
      if (state.singleCover) {
        state.spreads.push([0]);
        i = 1;
      }
      while (i < state.totalPages) {
        if (i + 1 < state.totalPages) {
          state.spreads.push([i, i + 1]);
          i += 2;
        } else {
          state.spreads.push([i]);
          i += 1;
        }
      }
      state.currentIndex = Math.min(state.currentIndex, state.spreads.length - 1);
      pageSlider.max = Math.max(0, state.spreads.length - 1);
      pageSlider.value = state.currentIndex;
    }

    function cleanupResources() {
      if (state.mode === "images") {
        state.imageItems.forEach((item) => {
          if (item.url) URL.revokeObjectURL(item.url);
        });
      }
      state.imageItems = [];
      state.pdfDoc = null;
      state.totalPages = 0;
    }

    async function handleFiles(fileList) {
      if (!fileList || fileList.length === 0) return;
      const files = Array.from(fileList);

      cleanupResources();
      showLoader(true, "ファイルを解析しています...");

      try {
        const first = files[0];
        const lowerName = first.name.toLowerCase();

        if (files.length === 1 && lowerName.endsWith(".pdf")) {
          if (!window.pdfjsLib) {
            throw new Error("PDF読み込みライブラリ(PDF.js)のロードに失敗しました。インターネット接続を確認してください。");
          }
          const arrayBuffer = await first.arrayBuffer();
          // file:// ローカル環境でCORSエラーにならないよう disableWorker: true を指定
          const loadingTask = window.pdfjsLib.getDocument({
            data: new Uint8Array(arrayBuffer),
            disableWorker: true
          });
          state.pdfDoc = await loadingTask.promise;
          state.mode = "pdf";
          state.totalPages = state.pdfDoc.numPages;
        } else if (
          files.length === 1 &&
          (lowerName.endsWith(".zip") || lowerName.endsWith(".cbz"))
        ) {
          if (!window.JSZip) {
            throw new Error("ZIP展開ライブラリ(JSZip)のロードに失敗しました。インターネット接続を確認してください。");
          }
          const zip = await window.JSZip.loadAsync(first);
          const entries = [];
          zip.forEach((relativePath, zipEntry) => {
            if (
              !zipEntry.dir &&
              !relativePath.startsWith("__MACOSX") &&
              /\.(jpe?g|png|webp|gif|bmp)$/i.test(relativePath)
            ) {
              entries.push(zipEntry);
            }
          });
          entries.sort((a, b) => collator.compare(a.name, b.name));

          if (entries.length === 0) {
            throw new Error("アーカイブ内に画像ファイルが見つかりませんでした。");
          }

          for (let i = 0; i < entries.length; i++) {
            showLoader(true, `画像を展開中 (${i + 1} / ${entries.length})...`);
            const blob = await entries[i].async("blob");
            state.imageItems.push({
              name: entries[i].name,
              url: URL.createObjectURL(blob)
            });
          }
          state.mode = "images";
          state.totalPages = state.imageItems.length;
        } else {
          const imgFiles = files
            .filter((f) => /\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name) || f.type.startsWith("image/"))
            .sort((a, b) => collator.compare(a.name, b.name));

          if (imgFiles.length === 0) {
            throw new Error("対応する画像(.jpg, .webp, .png)またはPDF/ZIPファイルを選択してください。");
          }

          state.imageItems = imgFiles.map((f) => ({
            name: f.name,
            url: URL.createObjectURL(f)
          }));
          state.mode = "images";
          state.totalPages = state.imageItems.length;
        }

        dropZone.style.display = "none";
        state.currentIndex = 0;
        buildSpreads();
        await renderCurrentSpread();
      } catch (err) {
        console.error(err);
        showToast("読み込みエラー: " + err.message, 6000);
      } finally {
        showLoader(false);
      }
    }

    async function getPageDrawable(pageIndex) {
      if (state.mode === "images") {
        const item = state.imageItems[pageIndex];
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = item.url;
        });
      }
      if (state.mode === "pdf") {
        const page = await state.pdfDoc.getPage(pageIndex + 1);
        const viewport = page.getViewport({ scale: 2.0 });
        const c = document.createElement("canvas");
        c.width = viewport.width;
        c.height = viewport.height;
        await page.render({
          canvasContext: c.getContext("2d"),
          viewport
        }).promise;
        return c;
      }
      return null;
    }

    async function renderCurrentSpread() {
      if (state.spreads.length === 0) return;

      const pair = state.spreads[state.currentIndex];
      pageSlider.value = state.currentIndex;

      const pageLabels = pair.map((idx) => idx + 1).join("-");
      pageInfo.textContent = `${pageLabels} / ${state.totalPages} P`;

      const drawables = await Promise.all(pair.map((idx) => getPageDrawable(idx)));

      if (drawables.length === 1) {
        const d = drawables[0];
        spreadCanvas.width = d.width;
        spreadCanvas.height = d.height;
        ctx.clearRect(0, 0, spreadCanvas.width, spreadCanvas.height);
        ctx.drawImage(d, 0, 0);
      } else {
        const leftDoc = state.rtl ? drawables[1] : drawables[0];
        const rightDoc = state.rtl ? drawables[0] : drawables[1];

        const h = Math.max(leftDoc.height, rightDoc.height);
        const leftW = Math.round(leftDoc.width * (h / leftDoc.height));
        const rightW = Math.round(rightDoc.width * (h / rightDoc.height));

        spreadCanvas.width = leftW + rightW;
        spreadCanvas.height = h;

        ctx.clearRect(0, 0, spreadCanvas.width, spreadCanvas.height);
        ctx.drawImage(leftDoc, 0, 0, leftW, h);
        ctx.drawImage(rightDoc, leftW, 0, rightW, h);

        // 中央ノド（折り目）の陰影
        const spineX = leftW;
        const shadowW = Math.max(24, Math.round(spreadCanvas.width * 0.025));
        const grad = ctx.createLinearGradient(spineX - shadowW, 0, spineX + shadowW, 0);
        grad.addColorStop(0, "rgba(0,0,0,0)");
        grad.addColorStop(0.45, "rgba(0,0,0,0.22)");
        grad.addColorStop(0.5, "rgba(0,0,0,0.42)");
        grad.addColorStop(0.55, "rgba(0,0,0,0.22)");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grad;
        ctx.fillRect(spineX - shadowW, 0, shadowW * 2, h);
      }
    }

    function goNext() {
      if (state.currentIndex < state.spreads.length - 1) {
        state.currentIndex++;
        renderCurrentSpread();
      }
    }

    function goPrev() {
      if (state.currentIndex > 0) {
        state.currentIndex--;
        renderCurrentSpread();
      }
    }

    // ファイル入力イベント（同じファイルの再選択にも対応）
    const fileInput = document.getElementById("file-input");
    const fileInputCenter = document.getElementById("file-input-center");

    fileInput.addEventListener("change", (e) => {
      handleFiles(e.target.files);
      e.target.value = "";
    });
    fileInputCenter.addEventListener("change", (e) => {
      handleFiles(e.target.files);
      e.target.value = "";
    });

    document.getElementById("btn-direction").addEventListener("click", (e) => {
      state.rtl = !state.rtl;
      e.target.textContent = state.rtl ? "右綴じ (←次へ)" : "左綴じ (次へ→)";
      renderCurrentSpread();
    });

    document.getElementById("btn-cover").addEventListener("click", (e) => {
      state.singleCover = !state.singleCover;
      e.target.textContent = state.singleCover ? "表紙単独: ON" : "表紙単独: OFF";
      buildSpreads();
      renderCurrentSpread();
    });

    document.getElementById("btn-prev").addEventListener("click", goPrev);
    document.getElementById("btn-next").addEventListener("click", goNext);

    document.getElementById("zone-left").addEventListener("click", () => {
      state.rtl ? goNext() : goPrev();
    });
    document.getElementById("zone-right").addEventListener("click", () => {
      state.rtl ? goPrev() : goNext();
    });

    pageSlider.addEventListener("input", (e) => {
      state.currentIndex = parseInt(e.target.value, 10);
      renderCurrentSpread();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") state.rtl ? goNext() : goPrev();
      if (e.key === "ArrowRight") state.rtl ? goPrev() : goNext();
      if (e.key === "f" || e.key === "F") toggleFullscreen();
    });

    const mainArea = document.getElementById("main-area");
    mainArea.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.style.display = "flex";
      dropZone.classList.add("dragover");
    });
    mainArea.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
      if (state.totalPages > 0) dropZone.style.display = "none";
    });
    mainArea.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      if (e.dataTransfer.files) handleFiles(e.dataTransfer.files);
    });
  });
</script>
</body>
</html>
